name: A workflow for the App
on: push

jobs:
  build:
    name: App action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Package JAR with Maven
        run: mvn -B package
      - name: Check the JAR exists
        run: test -f target/set08103-group4-jar-with-dependencies.jar
      - name: Build Docker Image
        run: docker build -t devopsimage .
      - name: Run image
        run: docker run --name devopscontainer -d devopsimage
      - name: view logs
        run: docker logs -f devopscontainer